name: Release et archives d'import

# Publie automatiquement chaque version du plugin.
# - Push sur main : si la version de .codex-plugin/plugin.json n'a pas encore de
#   release, crée la release vX.Y.Z (notes : .github/release-notes/vX.Y.Z.md si
#   présent, sinon notes générées) et y joint les archives d'import.
# - Release publiée depuis l'interface GitHub : y joint les archives.
# - Lancement manuel : reconstruit les archives d'une release existante.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à compléter (ex. v0.48.2)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Déterminer la version
        id: version
        run: |
          version=$(jq -r .version .codex-plugin/plugin.json)
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          tag="${tag:-v$version}"
          for f in .claude-plugin/plugin.json; do
            other=$(jq -r .version "$f")
            if [ "$other" != "$version" ]; then
              echo "::error file=$f::version $other différente de .codex-plugin/plugin.json ($version)"
              exit 1
            fi
          done
          if [ "$tag" != "v$version" ]; then
            echo "::error::le tag $tag ne correspond pas à la version $version des manifestes"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Arrêter si la version est déjà publiée (push sur main)
        if: github.event_name == 'push' && steps.version.outputs.exists == 'true'
        run: echo "La release ${{ steps.version.outputs.tag }} existe déjà ; rien à faire."

      - name: Construire les archives
        if: github.event_name != 'push' || steps.version.outputs.exists == 'false'
        run: ./scripts/build-zips.sh

      - name: Créer la release
        if: github.event_name == 'push' && steps.version.outputs.exists == 'false'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes=".github/release-notes/$tag.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "ARIA ${tag#v}" --latest "$@"

      - name: Joindre les archives à la release
        if: github.event_name != 'push' || steps.version.outputs.exists == 'false'
        run: gh release upload "${{ steps.version.outputs.tag }}" dist/aria-chatgpt.zip dist/aria-claude.zip --clobber
