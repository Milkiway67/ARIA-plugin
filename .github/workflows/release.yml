name: Archives d'import

# Construit les archives d'import manuel (ChatGPT et Claude) et les joint à la
# release du tag. Déclenché par le push d'un tag vX.Y.Z (la release est créée si
# elle n'existe pas, avec les notes de .github/release-notes/<tag>.md si présentes)
# ou par la publication d'une release depuis l'interface GitHub.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à compléter (ex. v0.48.2)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Vérifier la cohérence des versions
        run: |
          expected="${TAG#v}"
          for f in .codex-plugin/plugin.json .claude-plugin/plugin.json; do
            actual=$(jq -r .version "$f")
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$f::version $actual, attendue $expected (tag $TAG)"
              exit 1
            fi
          done

      - name: Construire les archives
        run: ./scripts/build-zips.sh

      - name: Créer la release si nécessaire
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            notes=".github/release-notes/$TAG.md"
            if [ -f "$notes" ]; then
              gh release create "$TAG" --title "ARIA ${TAG#v}" --notes-file "$notes" --latest
            else
              gh release create "$TAG" --title "ARIA ${TAG#v}" --generate-notes --latest
            fi
          fi

      - name: Joindre les archives à la release
        run: gh release upload "$TAG" dist/aria-chatgpt.zip dist/aria-claude.zip --clobber
